<html lang="fr">

<title>Gestion des devises — COBRA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
margin:0;
font-family:"Segoe UI",sans-serif;
color:#111;
min-height:100vh;
overflow-x:hidden;
padding-top:90px;
}

/* 🔥 HEADER COMME MONEY-MONITOR */
header{
position:fixed;
top:0;
left:0;
width:100%;
padding:14px 20px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(12px);
color:white;
z-index:999;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

header h1{
font-size:20px;
font-weight:bold;
color:white;
}

.live-box{
display:flex;
align-items:center;
gap:8px;
font-size:14px;
color:#00ff99;
font-weight:bold;
}

.live-dot{
width:10px;
height:10px;
border-radius:50%;
background:#00ff99;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

/* 🔥 BACKGROUND DYNAMIQUE */
.hero-wall{
position:fixed;
inset:0;
z-index:-2;
overflow:hidden;
}

.hero-wall video,
.hero-wall img{
width:100%;
height:100%;
object-fit:cover;
}

.hero-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.2);
z-index:-1;
}

/* 🔥 AUDIO */
.audio-btn{
position:fixed;
bottom:15px;
right:15px;
z-index:1000;
background:rgba(0,0,0,0.35);
border:none;
border-radius:50%;
width:42px;
height:42px;
color:white;
cursor:pointer;
font-size:18px;
}

/* 🔥 CONTAINER */
.container{
width:92%;
max-width:1100px;
margin:25px auto;
}

/* 🔥 CARD */
.card{
background:rgba(255,255,255,0.95);
color:#111;
padding:22px;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
animation:fadeUp 0.4s ease;
transition:0.3s;
margin-bottom:20px;
}

.card:hover{
transform:translateY(-4px);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h2{
margin-top:0;
color:#ff6a00;
}

/* 🔥 INPUT */
input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
background:rgba(255,255,255,0.95);
color:#111;
font-size:15px;
outline:none;
}

input::placeholder{
color:#999;
}

input:focus{
border:2px solid #ff6a00;
box-shadow:0 0 20px rgba(255,106,0,0.35);
}

/* 🔥 BOUTONS */
button{
padding:13px;
margin-top:12px;
border:none;
border-radius:14px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(45deg,#ff9a00,#ff3d00);
color:white;
font-size:15px;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

button:active{
transform:scale(0.95);
}

.btn-full{
width:100%;
}

.btn-back{
background:linear-gradient(45deg,#222,#444);
color:white;
padding:12px 18px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.btn-back:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.delete-btn{
background:crimson;
}

.small-btn{
padding:10px 14px;
width:auto;
}

/* 🔥 SECTION TITLE */
.section-title{
font-size:22px;
margin:30px 0 15px;
color:white;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(10px);
padding:14px 18px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
cursor:pointer;
}

/* 🔥 LISTE */
.currency-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
margin-top:15px;
}

.currency-item{
background:rgba(255,255,255,0.95);
color:#111;
padding:18px;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
transition:0.3s;
}

.currency-item:hover{
transform:translateY(-4px);
}

.currency-code{
font-size:26px;
font-weight:bold;
color:#ff6a00;
margin-bottom:8px;
}

.currency-country{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.currency-rate{
font-size:15px;
margin-top:8px;
color:#333;
font-weight:600;
}

.actions{
display:flex;
gap:10px;
margin-top:12px;
flex-wrap:wrap;
}

.hidden{
display:none;
}

/* 🔥 SEARCH */
.search-box{
display:flex;
gap:10px;
align-items:center;
}

.search-box input{
margin-top:0;
}

/* 🔥 RESPONSIVE */
@media(max-width:700px){
header h1{
font-size:17px;
}

.section-title{
font-size:18px;
}

.search-box{
flex-direction:column;
align-items:stretch;
}
}
</style>
</head>

</a>
</p>

</div>

function formatXOF(value){
  const numericValue =
    Number(value);

  if(
    !Number.isFinite(numericValue)
  ){
    return "Indisponible";
  }

  const absoluteValue =
    Math.abs(numericValue);

  let maximumFractionDigits;

  /*
  Les taux importants nécessitent peu
  de décimales visibles.

  Les petites devises conservent davantage
  de décimales pour ne jamais afficher zéro.
  */
  if(absoluteValue >= 100){
    maximumFractionDigits = 3;

  }else if(absoluteValue >= 1){
    maximumFractionDigits = 4;

  }else if(absoluteValue >= 0.01){
    maximumFractionDigits = 6;

  }else{
    maximumFractionDigits = 8;
  }

  return numericValue.toLocaleString(
    "fr-FR",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits
    }
  ) + " FCFA";
}

   Cette synchronisation :
   - conserve les anciennes entrées Firebase ;
   - ne supprime jamais une devise existante ;

let maliPayAutomaticCurrencySyncRunning =
  false;

function normalizeCountryComparisonName(
  value
){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}

function isCurrencyCountryDisabled(
  countryData
){
  const countryCode =
    String(
      countryData?.countryCode ||
      ""
    )
      .trim()
      .toUpperCase();

  if(!countryCode){
    return false;
  }

  return Boolean(
    disabledCurrencies[
      countryCode
    ]
  );
}

function createAutomaticCurrencyKey(
  countryData,
  occupiedKeys
){
  const basicKey =
    String(
      countryData.prefix || ""
    ).trim();

  if(
    basicKey &&
    !occupiedKeys.has(basicKey)
  ){
    return basicKey;
  }

  /*
  Certains pays partagent un indicatif,
  notamment +1 ou +7.

  Dans ce cas, le code du pays évite
  d’écraser une autre entrée.
  */
  return (
    basicKey +
    "_" +
    countryData.countryCode
  );
}

/* =====================================================
   ⚡ COMPARAISON INTELLIGENTE DES DEVISES

   Ces fonctions déterminent si une donnée Firebase
   doit réellement être ajoutée ou mise à jour.
===================================================== */

function areCurrencyRatesEquivalent(
  firstRate,
  secondRate
){
  const firstValue =
    Number(firstRate);

  const secondValue =
    Number(secondRate);

  if(
    !Number.isFinite(firstValue) ||
    !Number.isFinite(secondValue)
  ){
    return false;
  }

  const difference =
    Math.abs(
      firstValue -
      secondValue
    );

  /*
  Tolérance très faible destinée seulement
  aux petites différences de calcul JavaScript.

  Elle ne masque pas un véritable changement
  du taux de change.
  */
  const tolerance =
    Math.max(
      0.000000000001,
      Math.abs(secondValue) *
      0.0000000001
    );

  return difference <= tolerance;
}

function normalizeCurrencyField(
  value
){
  return String(
    value ?? ""
  ).trim();
}

function currencyRecordNeedsUpdate(
  previousData,
  nextData
){
  if(
    !previousData ||
    typeof previousData !== "object"
  ){
    return true;
  }

  /*
  Comparaison des informations utilisées
  par currencies.html et les autres pages.
  */
  const textFields = [
    "prefix",
    "code",
    "country",
    "countryCode",
    "flag",
    "symbol",
    "rateSource"
  ];

  const textFieldChanged =
    textFields.some(field =>
      normalizeCurrencyField(
        previousData[field]
      ) !==
      normalizeCurrencyField(
        nextData[field]
      )
    );

  if(textFieldChanged){
    return true;
  }

  if(
    Boolean(previousData.automatic) !==
    Boolean(nextData.automatic)
  ){
    return true;
  }

  if(
    !areCurrencyRatesEquivalent(
      previousData.rateToXOF,
      nextData.rateToXOF
    )
  ){
    return true;
  }

  return false;
}

unchangedCountries += 1;
      });

    if(

}

    console.log(

window.addCurrency = async function(){

const prefix =
document.getElementById("prefix")
.value.trim();

const code =
document.getElementById("code")
.value.trim()
.toUpperCase();

const country =
document.getElementById("country")
.value.trim();

const flag =
document.getElementById("flag")
.value.trim();

const symbol =
document.getElementById("symbol")
.value.trim();

if(
!prefix ||
!code ||
!country ||
!flag ||
!symbol
){

alert("❌ Remplis tous les champs");

return;
}

const matchingCatalogCountry =
  MALIPAY_COUNTRY_CATALOG.find(
    item =>
      item.prefix === prefix ||
      normalizeCountryComparisonName(
        item.country
      ) ===
      normalizeCountryComparisonName(
        country
      )
  );

const matchingCountryCode =
  String(
    matchingCatalogCountry
      ?.countryCode ||
    ""
  )
    .trim()
    .toUpperCase();

/* 🔥 sauvegarde Firebase */

const currentRateToXOF =
  getRateToXOF(code);

if(currentRateToXOF === null){
  alert(
    "❌ Cette devise n’est pas couverte par le fournisseur de taux actuel."
  );

  return;
}

await set(
  ref(
    db,
    "currencies/" +
    prefix
  ),
  {
    prefix,
    code,
    country,
    flag,
    symbol,

    rateToXOF:
      currentRateToXOF,

    rateUpdatedAt:
      maliPayRateMetadata
        .lastUpdateAt ||
      Date.now(),

    rateNextUpdateAt:
      maliPayRateMetadata
        .nextUpdateAt ||
      0,

    rateSource:
      maliPayRateMetadata
        .source,

    automatic:
      false
  }
);

if(matchingCountryCode){
  await remove(
    ref(
      db,
      "disabledCurrencies/" +
      matchingCountryCode
    )
  );
}

alert("✅ Devise ajoutée");

/* reset */

document.getElementById("code").value="";
document.getElementById("symbol").value="";
document.getElementById("prefix").value="";
document.getElementById("country").value="";
document.getElementById("flag").value="";
};

/* =====================================================
   🌍 MOTEUR GLOBAL DES TAUX MALIPAY

   Une seule requête charge tous les taux avec XOF
   comme devise de base.

   L’API répond par exemple :
   1 XOF = plusieurs unités de NGN.

   Pour obtenir :
   1 NGN = combien de XOF

   on calcule :
   1 / taux reçu.
===================================================== */

const MALIPAY_RATE_API_URL =
  "https://open.er-api.com/v6/latest/XOF";

const MALIPAY_RATE_CACHE_KEY =
  "malipayExchangeRatesXOFV2";

const MALIPAY_RATE_FALLBACK_TTL =
  24 * 60 * 60 * 1000;

let maliPayRatesToXOF = {
  XOF: 1
};

let maliPayRateMetadata = {
  source:
    "ExchangeRate-API",

  lastUpdateAt:
    0,

  nextUpdateAt:
    0
};

let maliPayRatesLoadingPromise =
  null;

/*
=====================================================
🛡️ VALIDATION ET SECOURS FIREBASE DES TAUX

Les taux sont conservés sous cette forme :

1 unité de devise = combien de XOF.

Exemple :
EUR : 655.957
NGN : 0.38...
=====================================================
*/

const MALIPAY_RATE_SCHEMA_VERSION =
  2;

function normalizeStoredRatesToXOF(
  rawRates
){
  if(
    !rawRates ||
    typeof rawRates !== "object"
  ){
    return {
      XOF: 1
    };
  }

  const normalizedRates = {
    XOF: 1
  };

  Object.entries(
    rawRates
  ).forEach(
    ([
      currencyCode,
      rawRate
    ])=>{
      const normalizedCode =
        String(
          currencyCode || ""
        )
          .trim()
          .toUpperCase();

      const numericRate =
        Number(
          rawRate
        );

      /*
      Refuser les valeurs dangereuses :
      - NaN ;
      - Infinity ;
      - zéro ;
      - nombre négatif ;
      - code vide.
      */
      if(
        !normalizedCode ||
        !Number.isFinite(
          numericRate
        ) ||
        numericRate <= 0
      ){
        return;
      }

      normalizedRates[
        normalizedCode
      ] =
        normalizedCode === "XOF"
          ? 1
          : numericRate;
    }
  );

  return normalizedRates;
}

function createMaliPayRateCacheData({
  rates,
  source,
  lastUpdateAt,
  nextUpdateAt,
  savedAt = Date.now()
}){
  return {
    schemaVersion:
      MALIPAY_RATE_SCHEMA_VERSION,

    baseCurrency:
      "XOF",

    source:
      source ||
      "ExchangeRate-API",

    lastUpdateAt:
      Number(
        lastUpdateAt || 0
      ),

    nextUpdateAt:
      Number(
        nextUpdateAt || 0
      ),

    savedAt:
      Number(
        savedAt || Date.now()
      ),

    rates:
      normalizeStoredRatesToXOF(
        rates
      )
  };
}

async function readRatesFromFirebase(){
  try{
    const snapshot =
      await get(
        ref(
          db,
          "exchangeRates/XOF"
        )
      );

    if(!snapshot.exists()){
      return null;
    }

    const firebaseData =
      snapshot.val();

    if(
      !firebaseData ||
      !firebaseData.rates
    ){
      return null;
    }

    return createMaliPayRateCacheData({
      rates:
        firebaseData.rates,

      source:
        firebaseData.source ||
        "Firebase",

      lastUpdateAt:
        firebaseData.lastUpdateAt,

      nextUpdateAt:
        firebaseData.nextUpdateAt,

      savedAt:
        firebaseData.savedAt
    });

  }catch(error){
    console.warn(
      "Lecture Firebase des taux impossible :",
      error
    );

    return null;
  }
}

function readMaliPayRateCache(){
  try{
    const stored =
      localStorage.getItem(
        MALIPAY_RATE_CACHE_KEY
      );

    if(!stored){
      return null;
    }

    const parsed =
      JSON.parse(stored);

    if(
      !parsed ||
      typeof parsed !== "object" ||
      !parsed.rates ||
      typeof parsed.rates !== "object"
    ){
      return null;
    }

    return parsed;

  }catch(error){
    console.warn(
      "Cache local des taux invalide :",
      error
    );

    return null;
  }
}

function saveMaliPayRateCache(
  cacheData
){
  try{
    localStorage.setItem(
      MALIPAY_RATE_CACHE_KEY,
      JSON.stringify(cacheData)
    );

  }catch(error){
    console.warn(
      "Enregistrement local des taux impossible :",
      error
    );
  }
}

function applyMaliPayRateCache(
  cacheData
){
  if(
    !cacheData ||
    !cacheData.rates
  ){
    return false;
  }

  const normalizedCache =
    createMaliPayRateCacheData({
      rates:
        cacheData.rates,

      source:
        cacheData.source,

      lastUpdateAt:
        cacheData.lastUpdateAt,

      nextUpdateAt:
        cacheData.nextUpdateAt,

      savedAt:
        cacheData.savedAt
    });

  maliPayRatesToXOF =
    normalizedCache.rates;

  maliPayRateMetadata = {
    source:
      normalizedCache.source,

    lastUpdateAt:
      normalizedCache.lastUpdateAt,

    nextUpdateAt:
      normalizedCache.nextUpdateAt
  };

  return true;
}

function getRateToXOF(
  currencyCode
){
  const normalizedCode =
    String(currencyCode || "")
      .trim()
      .toUpperCase();

  if(normalizedCode === "XOF"){
    return 1;
  }

  const rate =
    Number(
      maliPayRatesToXOF[
        normalizedCode
      ]
    );

  return (
    Number.isFinite(rate) &&
    rate > 0
  )
    ? rate
    : null;
}

async function saveRatesToFirebase(){
  try{
    const firebaseRateData =
      createMaliPayRateCacheData({
        rates:
          maliPayRatesToXOF,

        source:
          maliPayRateMetadata.source,

        lastUpdateAt:
          maliPayRateMetadata.lastUpdateAt,

        nextUpdateAt:
          maliPayRateMetadata.nextUpdateAt,

        savedAt:
          Date.now()
      });

    await set(
      ref(
        db,
        "exchangeRates/XOF"
      ),
      firebaseRateData
    );

    return true;

  }catch(error){
    /*
    Une erreur Firebase ne doit jamais empêcher
    l’affichage ou les conversions.
    */
    console.warn(
      "Sauvegarde globale des taux dans Firebase ignorée :",
      error
    );

    return false;
  }
}

async function loadAllMaliPayRates(
  forceRefresh = false
){
  if(maliPayRatesLoadingPromise){
    return await maliPayRatesLoadingPromise;
  }

  maliPayRatesLoadingPromise =
    (async ()=>{
      const cachedData =
        readMaliPayRateCache();

      const now =
        Date.now();

      const localCacheStillValid =
        cachedData &&
        Number(
          cachedData.nextUpdateAt || 0
        ) > now;

      /*
      PRIORITÉ 1 :
      cache local encore valide.
      */
      if(
        cachedData &&
        localCacheStillValid &&
        !forceRefresh
      ){
        applyMaliPayRateCache(
          cachedData
        );

        console.log(
          "✅ Taux MaliPay restaurés depuis le cache local."
        );

        return maliPayRatesToXOF;
      }

      /*
      PRIORITÉ 2 :
      demander des taux frais à ExchangeRate-API.
      */
      try{
        const response =
          await fetch(
            MALIPAY_RATE_API_URL,
            {
              method:
                "GET",

              headers: {
                Accept:
                  "application/json"
              },

              cache:
                "no-store"
            }
          );

        if(!response.ok){
          throw new Error(
            `Erreur HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if(
          data.result !== "success" ||
          !data.rates ||
          typeof data.rates !==
            "object"
        ){
          throw new Error(
            data["error-type"] ||
            "Réponse de taux invalide."
          );
        }

        const ratesToXOF = {
          XOF: 1
        };

        Object.entries(
          data.rates
        ).forEach(
          ([
            currencyCode,
            unitsPerXOF
          ])=>{
            const normalizedCode =
              String(
                currencyCode || ""
              )
                .trim()
                .toUpperCase();

            const numericRate =
              Number(
                unitsPerXOF
              );

            if(
              !normalizedCode ||
              !Number.isFinite(
                numericRate
              ) ||
              numericRate <= 0
            ){
              return;
            }

            /*
            L’API fournit :

            1 XOF = numericRate unités.

            MaliPay enregistre :

            1 unité = combien de XOF.

            Aucune valeur n’est arrondie ici.
            */
            ratesToXOF[
              normalizedCode
            ] =
              normalizedCode === "XOF"
                ? 1
                : 1 / numericRate;
          }
        );

        const lastUpdateAt =
          Number(
            data.time_last_update_unix ||
            0
          ) * 1000;

        const nextUpdateAt =
          Number(
            data.time_next_update_unix ||
            0
          ) * 1000;

        const freshCacheData =
          createMaliPayRateCacheData({
            rates:
              ratesToXOF,

            source:
              "ExchangeRate-API",

            lastUpdateAt:
              lastUpdateAt ||
              now,

            nextUpdateAt:
              nextUpdateAt ||
              now +
              MALIPAY_RATE_FALLBACK_TTL,

            savedAt:
              now
          });

        applyMaliPayRateCache(
          freshCacheData
        );

        saveMaliPayRateCache(
          freshCacheData
        );

        await saveRatesToFirebase();

        console.log(
          "✅ Tous les taux MaliPay ont été chargés :",
          Object.keys(
            maliPayRatesToXOF
          ).length,
          "devises."
        );

        return maliPayRatesToXOF;

      }catch(apiError){
        console.warn(
          "API de taux momentanément indisponible :",
          apiError
        );
      }

      /*
      PRIORITÉ 3 :
      récupérer les derniers taux depuis Firebase.
      */
      const firebaseData =
        await readRatesFromFirebase();

      if(firebaseData){
        applyMaliPayRateCache(
          firebaseData
        );

        saveMaliPayRateCache(
          firebaseData
        );

        console.warn(
          "⚠️ Taux MaliPay restaurés depuis Firebase."
        );

        return maliPayRatesToXOF;
      }

      /*
      PRIORITÉ 4 :
      utiliser l’ancien cache local expiré.
      */
      if(cachedData){
        applyMaliPayRateCache(
          cachedData
        );

        console.warn(
          "⚠️ Ancien cache local des taux utilisé temporairement."
        );

        return maliPayRatesToXOF;
      }

      throw new Error(
        "Aucun taux de change n’est disponible."
      );
    })();

  try{
    return await maliPayRatesLoadingPromise;

  }finally{
    maliPayRatesLoadingPromise =
      null;
  }
}

function renderCurrencies(){
  const search =
    (
      searchCurrency.value ||
      ""
    )
      .trim()
      .toLowerCase();

  currencyList.innerHTML =
    "";

  const entries =
    Object.entries(
      allCurrencies
    )
      .sort(
        (
          [, firstCurrency],
          [, secondCurrency]
        ) =>
          String(
            firstCurrency?.country ||
            ""
          ).localeCompare(
            String(
              secondCurrency?.country ||
              ""
            ),
            "fr",
            {
              sensitivity:
                "base"
            }
          )
      );

  if(entries.length === 0){
    currencyList.innerHTML = `
      <div class="currency-item">
        Aucune devise disponible
      </div>
    `;

    return;
  }

  let displayedCurrencies =
    0;

  for(
    const [
      firebaseKey,
      currency
    ] of entries
  ){
    const prefix =
      currency.prefix ||
      firebaseKey;

    const code =
      String(
        currency.code ||
        ""
      ).toUpperCase();

    const country =
      currency.country ||
      "";

    const countryCode =
      currency.countryCode ||
      "";

    const flag =
      currency.flag ||
      "";

    const symbol =
      currency.symbol ||
      code;

    const searchableText =
      (
        prefix +
        " " +
        code +
        " " +
        country +
        " " +
        countryCode +
        " " +
        flag +
        " " +
        symbol
      ).toLowerCase();

    if(
      search &&
      !searchableText.includes(
        search
      )
    ){
      continue;
    }

    displayedCurrencies += 1;

    /*
    Le taux en mémoire est prioritaire.

    Le taux Firebase sert de secours
    lorsqu’Internet est indisponible.
    */
    const liveRate =
      getRateToXOF(code) ??
      (
        Number.isFinite(
          Number(
            currency.rateToXOF
          )
        )
          ? Number(
              currency.rateToXOF
            )
          : null
      );

    currencyList.innerHTML += `
      <div class="currency-item">

        <div class="currency-code">
          ${code}
        </div>

        <div class="currency-country">
          ${country}
        </div>

        <div class="currency-rate">
          🌍 ${flag}
          ${countryCode}
          ${country}
        </div>

        <div class="currency-rate">
          📱 ${prefix}
        </div>

        <div class="currency-rate">
          💵 Symbole :
          <b>${symbol}</b>
        </div>

        <div class="currency-rate">
          💰 1 ${code} =
          <b>
            ${
              liveRate !== null
                ? formatXOF(
                    liveRate
                  )
                : "Indisponible"
            }
          </b>
        </div>

        <div
          class="currency-rate"
          style="
            font-size:12px;
            color:#666;
          "
        >
          🔄 Source :
          ${
            currency.rateSource ||
            maliPayRateMetadata.source ||
            "ExchangeRate-API"
          }
        </div>

        <div class="actions">
          <button
            class="small-btn delete-btn"
            onclick="deleteCurrency(
              '${firebaseKey}',
              '${countryCode}',
              '${String(country)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")}'
            )"
          >
            🗑 Supprimer
          </button>
        </div>

      </div>
    `;
  }

  if(displayedCurrencies === 0){
    currencyList.innerHTML = `
      <div class="currency-item">
        Aucun résultat pour cette recherche.
      </div>
    `;
  }
}

let resolveInitialCurrencies;

const initialCurrenciesPromise =

onValue(

/* =====================================================
   🚀 INITIALISATION AUTOMATIQUE

   Ordre :
   1. charger tous les taux ;
   2. attendre les anciennes devises Firebase ;
   3. ajouter ou actualiser tous les pays ;
   4. réafficher les cartes.
===================================================== */

async function initializeAutomaticCurrencySystem(){
  const status =
    document.getElementById(
      "currencySyncStatus"
    );

  try{
    if(status){
      status.innerHTML =
        "⏳ Chargement de tous les taux mondiaux...";
    }

    await Promise.all([
      loadAllMaliPayRates(),
      initialCurrenciesPromise,
      initialDisabledCurrenciesPromise
    ]);

    /*
    Actualiser immédiatement les anciennes
    cartes avec les taux chargés.
    */
    renderCurrencies();

    await synchronizeAutomaticCurrencies();

  }catch(error){
    console.error(
      "Erreur initialisation système monétaire MaliPay :",
      error
    );

    if(status){
      status.innerHTML =
        "❌ Impossible d’initialiser toutes les devises : " +
        error.message;

      status.style.color =
        "crimson";
    }
  }
}

initializeAutomaticCurrencySystem();

window.deleteCurrency =
async function(
  firebaseKey,
  countryCode,
  countryName
){
  const normalizedCountryCode =
    String(
      countryCode || ""
    )
      .trim()
      .toUpperCase();

  const displayedCountryName =
    String(
      countryName ||
      "ce pays"
    ).trim();

  const confirmed =
    confirm(
      "Supprimer " +
      displayedCountryName +
      " de MaliPay ?\n\n" +
      "Ce pays ne sera plus recréé automatiquement."
    );

  if(!confirmed){
    return;
  }

  try{
    const firebaseUpdates = {};

    /*
    Supprimer la carte active.
    */
    firebaseUpdates[
      "currencies/" +
      firebaseKey
    ] = null;

    /*
    Mémoriser la désactivation avec le code ISO.
    */
    if(normalizedCountryCode){
      firebaseUpdates[
        "disabledCurrencies/" +
        normalizedCountryCode
      ] = {
        countryCode:
          normalizedCountryCode,

        country:
          displayedCountryName,

        disabledAt:
          Date.now()
      };
    }

    await update(
      ref(db),
      firebaseUpdates
    );

    alert(
      "✅ " +
      displayedCountryName +
      " a été supprimé durablement."
    );

  }catch(error){
    console.error(
      "Erreur suppression devise :",
      error
    );

    alert(
      "❌ Impossible de supprimer cette devise : " +
      error.message
    );
  }
};

window.showDisabledCurrencies =
async function(){
  const disabledEntries =
    Object.entries(
      disabledCurrencies ||
      {}
    );

  if(disabledEntries.length === 0){
    alert(
      "✅ Aucun pays n’est actuellement désactivé."
    );

    return;
  }

  const disabledList =
    disabledEntries
      .map(
        ([
          countryCode,
          data
        ], index) =>
          (
            index + 1
          ) +
          ". " +
          (
            data?.country ||
            countryCode
          ) +
          " (" +
          countryCode +
          ")"
      )
      .join("\n");

  const countryCodeToRestore =
    prompt(
      "Pays désactivés :\n\n" +
      disabledList +
      "\n\n" +
      "Entre le code ISO du pays à restaurer.\n" +
      "Exemple : NG"
    );

  if(!countryCodeToRestore){
    return;
  }

  const normalizedCountryCode =
    String(
      countryCodeToRestore
    )
      .trim()
      .toUpperCase();

  if(
    !disabledCurrencies[
      normalizedCountryCode
    ]
  ){
    alert(
      "❌ Ce code pays n’est pas dans la liste des pays désactivés."
    );

    return;
  }

  try{
    await remove(
      ref(
        db,
        "disabledCurrencies/" +
        normalizedCountryCode
      )
    );

    delete disabledCurrencies[
      normalizedCountryCode
    ];

    await synchronizeAutomaticCurrencies();

    alert(
      "✅ Le pays " +
      normalizedCountryCode +
      " a été réactivé."
    );

  }catch(error){
    console.error(
      "Erreur réactivation pays :",
      error
    );

    alert(
      "❌ Impossible de réactiver ce pays : " +
      error.message
    );
  }
};
